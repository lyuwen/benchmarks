# Minimal single-container Harbor task used as a local fixture.
# It runs against a small public image and needs no build step.
schema_version = "1.2"

[task]
name = "openhands/hello-harbor"
description = "Create a file with exact content and verify it."
keywords = ["fixture", "smoke"]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 300.0

[environment]
docker_image = "debian:bookworm-slim"
cpus = 1
memory_mb = 1024
